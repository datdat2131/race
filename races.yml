# ============================================================
#  AstraXRace - định nghĩa chủng tộc, nội tại và BUFF
#
#  stats:    (TẤT CẢ race dùng chung chỉ số gốc 20 HP / 1.0 / 1.0 / 0 / 0 / 5% - khác biệt nằm ở nội tại + buff)
#            health (HP, 20 = 10 tim), speed (1.0 = bình thường), strength (hệ số sát thương),
#            jump (+% độ cao nhảy, 0.2 = +20%), knockback-resistance (0..1), critical-chance (0..1)
#  (Không còn độ hiếm: mọi race có chỉ số gốc và tỉ lệ roll ngang nhau)
#  growth:   chỉ số cộng thêm MỖI cấp race
#  passives: nội tại luôn bật (xem README)
#  buffs:    buff TỰ ĐỘNG khi đúng điều kiện và đủ cấp mở khóa (không cần bấm gì)
#            condition: ALWAYS IN_WATER UNDERGROUND NIGHT DAY LOW_HEALTH FULL_HEALTH IN_NETHER IN_END
#                       IN_RAIN SNEAKING SPRINTING ON_FIRE HIGH_ALTITUDE
#            tác dụng:  effects (potion), damage-multiplier (sát thương gây ra), defense-multiplier (sát thương nhận,
#                       <1 = giảm; >1 = điểm yếu), regen (HP/giây), on-kill, on-hurt
#  cosmetic: cánh / vật phẩm đi theo / đuôi nhận dạng (xem README mục Cosmetic)
#  Hiệu ứng potion dùng ID Minecraft: SPEED, STRENGTH, RESISTANCE, REGENERATION, WITHER, SLOWNESS, JUMP_BOOST,
#  ABSORPTION, SLOW_FALLING, NIGHT_VISION... ; riêng type FIRE = đốt cháy (duration = tick)
#  Với buff theo điều kiện, để duration: 40 (tự gia hạn mỗi giây); NIGHT_VISION dùng 260 để không nhấp nháy.
# ============================================================

