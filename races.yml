# ============================================================
#  AstraXRace - định nghĩa chủng tộc & kỹ năng
#
#  stats:   health (HP, 20 = 10 tim), speed (1.0 = bình thường), strength (hệ số sát thương),
#           jump (+% độ cao nhảy, 0.2 = +20%), knockback-resistance (0..1), critical-chance (0..1)
#  growth:  chỉ số cộng thêm MỖI cấp race
#  passives: nội tại (xem README)
#  cosmetic: cánh / vật phẩm đi theo / đuôi nhận dạng (xem README mục Cosmetic)
#  skills.<id>.type: AOE_DAMAGE | SELF_BUFF | HEAL | DASH | NO_FALL
#  skills.<id>.trigger: RIGHT_CLICK | SHIFT_RIGHT_CLICK | COMMAND (/race skill <id>)
#  Hiệu ứng potion dùng ID Minecraft: SPEED, STRENGTH, RESISTANCE, REGENERATION, WITHER,
#  SLOWNESS, JUMP_BOOST, ABSORPTION, SLOW_FALLING... ; riêng type FIRE = đốt cháy (duration = tick)
# ============================================================

