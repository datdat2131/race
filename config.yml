# ============================================================
#  AstraXRace - cấu hình chung
#  Sửa xong dùng /race reload (đổi storage.type cần restart server)
# ============================================================

storage:
  type: sqlite              # sqlite (players.db) | yaml (players.yml)
  autosave-minutes: 5

race:
  max-changes: 1            # số lần được ĐỔI race sau lần chọn đầu (-1 = không giới hạn)
  reset-progress-on-change: true   # đổi race thì reset level/exp/nâng cấp
  open-gui-on-join: true    # mở GUI chọn race cho người chưa có race
  open-gui-delay-ticks: 60

leveling:
  max-level: 50
  exp-base: 100             # EXP cần để lên cấp 2
  exp-growth: 1.12          # EXP cần = exp-base * exp-growth^(cấp-1)
  points-per-level: 1       # điểm nâng cấp nhận mỗi cấp
  starting-points: 0
  level-up-sound: entity.player.levelup

exp:
  mob-default: 5            # Race EXP khi giết quái hostile/boss
  mobs:                     # ghi đè theo EntityType
    ZOMBIE: 6
    SKELETON: 6
    CREEPER: 8
    ENDERMAN: 12
    WITCH: 15
    BLAZE: 12
    WITHER_SKELETON: 20
    ELDER_GUARDIAN: 200
    WARDEN: 500
    WITHER: 600
    ENDER_DRAGON: 1000
  player-kill: 40
  show-actionbar: true

combat:
  critical-multiplier: 1.5  # nhân sát thương khi chí mạng
  critical-sound: entity.player.attack.crit

# ---------------- Cosmetic nhận dạng (cánh, vật phẩm đi theo, đuôi) ----------------
# Định nghĩa từng race nằm trong races.yml (mục cosmetic). Cosmetic dùng ItemDisplay,
# không lưu xuống đĩa và tự dọn khi người chơi thoát / đổi race / tắt plugin.
cosmetic:
  enabled: true
  update-ticks: 2            # chu kỳ cập nhật (1-10). Nhỏ = mượt hơn nhưng tốn tài nguyên hơn
  view-range: 0.6            # tầm nhìn của entity (0.6 ~ 38 block)
  hide-when-gliding: true    # ẩn khi đang lướt bằng Elytra
  hide-when-invisible: true  # ẩn khi người chơi tàng hình (potion)
  sneak-drop: 0.2            # hạ thấp cosmetic khi ngồi xuống (Shift)

# ---------------- Nâng cấp thuộc tính ----------------
# per-level: giá trị cộng thêm mỗi cấp nâng cấp
#   strength   : +hệ số sát thương (0.02 = +2%)
#   defense    : giảm sát thương nhận (0.015 = -1.5%)
#   speed      : +hệ số tốc độ di chuyển
#   health     : +máu (HP, 2 HP = 1 tim)
#   critical   : +tỉ lệ chí mạng (0.01 = +1%)
#   regen      : +HP hồi mỗi giây (cộng với buff hồi máu của tộc)
upgrades:
  strength:
    slot: 10
    material: IRON_SWORD
    name: '&c&lStrength'
    description: '&7Tăng sát thương gây ra.'
    max-level: 10
    cost: 1
    per-level: 0.02
    display-multiplier: 100
    unit: '%'
    lore: ['{desc}', ' ', '&7Cấp: &f{level}&7/&f{max}', '&7Hiện tại: &a+{bonus}', '&7Mỗi cấp: &e+{per}', '&7Giá: &6{cost} điểm']
  defense:
    slot: 11
    material: SHIELD
    name: '&9&lDefense'
    description: '&7Giảm sát thương nhận vào.'
    max-level: 10
    cost: 1
    per-level: 0.015
    display-multiplier: 100
    unit: '%'
    lore: ['{desc}', ' ', '&7Cấp: &f{level}&7/&f{max}', '&7Hiện tại: &a-{bonus}', '&7Mỗi cấp: &e-{per}', '&7Giá: &6{cost} điểm']
  speed:
    slot: 12
    material: SUGAR
    name: '&f&lSpeed'
    description: '&7Tăng tốc độ di chuyển.'
    max-level: 10
    cost: 1
    per-level: 0.01
    display-multiplier: 100
    unit: '%'
    lore: ['{desc}', ' ', '&7Cấp: &f{level}&7/&f{max}', '&7Hiện tại: &a+{bonus}', '&7Mỗi cấp: &e+{per}', '&7Giá: &6{cost} điểm']
  health:
    slot: 14
    material: GOLDEN_APPLE
    name: '&a&lHealth'
    description: '&7Tăng máu tối đa.'
    max-level: 10
    cost: 1
    per-level: 1.0
    display-multiplier: 1
    unit: ' HP'
    lore: ['{desc}', ' ', '&7Cấp: &f{level}&7/&f{max}', '&7Hiện tại: &a+{bonus}', '&7Mỗi cấp: &e+{per}', '&7Giá: &6{cost} điểm']
  critical:
    slot: 15
    material: GOLDEN_SWORD
    name: '&6&lCritical'
    description: '&7Tăng tỉ lệ chí mạng.'
    max-level: 10
    cost: 1
    per-level: 0.01
    display-multiplier: 100
    unit: '%'
    lore: ['{desc}', ' ', '&7Cấp: &f{level}&7/&f{max}', '&7Hiện tại: &a+{bonus}', '&7Mỗi cấp: &e+{per}', '&7Giá: &6{cost} điểm']
  regen:
    slot: 16
    material: GOLDEN_CARROT
    name: '&d&lRegen'
    description: '&7Hồi máu liên tục mỗi giây.'
    max-level: 10
    cost: 1
    per-level: 0.1
    display-multiplier: 1
    unit: ' HP/s'
    lore: ['{desc}', ' ', '&7Cấp: &f{level}&7/&f{max}', '&7Hiện tại: &a+{bonus}', '&7Mỗi cấp: &e+{per}', '&7Giá: &6{cost} điểm']

# ---------------- GUI ----------------
gui:
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  main:
    title: '&8Chọn Chủng tộc'
    rows: 4
    status-current: '&a✔ Chủng tộc hiện tại của bạn'
    status-other: '&7Click để xem chi tiết'
    lore: []
    close:
      slot: 31
      material: BARRIER
      name: '&cĐóng'
  detail:
    title: '&8Chủng tộc: {race}'
    rows: 5
    info-slot: 4
    stats:
      slot: 19
      material: IRON_SWORD
      name: '&6&lChỉ số'
      lore:
        - '&7Máu: &c{health} HP &8({hearts} tim)'
        - '&7Tốc độ: &f{speed}%'
        - '&7Sức mạnh: &f{strength}%'
        - '&7Nhảy cao: &f+{jump}%'
        - '&7Kháng knockback: &f{knockback}%'
        - '&7Chí mạng: &f{critical}%'
    buffs:
      slot: 21
      material: BLAZE_POWDER
      name: '&d&lBuff'
      line: '&e{name} &8(Lv {level} • {condition})'
      desc-prefix: '  &7'
    strengths:
      slot: 23
      material: LIME_DYE
      name: '&a&lĐiểm mạnh'
      prefix: '&a+ &7'
    weaknesses:
      slot: 25
      material: RED_DYE
      name: '&c&lĐiểm yếu'
      prefix: '&c- &7'
    back:
      slot: 36
      material: ARROW
      name: '&7« Quay lại'
    confirm:
      slot: 40
      material: EMERALD_BLOCK
      name: '&a&lXÁC NHẬN CHỌN &r{race}'
      glow: true
      lore:
        - '&7Click để chọn chủng tộc này.'
        - '&8Số lần đổi còn lại: &f{changes_left}'
    close:
      slot: 44
      material: BARRIER
      name: '&cĐóng'
  upgrade:
    title: '&8Nâng cấp Chủng tộc'
    rows: 3
    click-line: '&aClick trái để nâng cấp'
    maxed-line: '&6★ Đã đạt cấp tối đa'
    info:
      slot: 4
      material: NETHER_STAR
      name: '&b&lCấp {level} &7- {race}'
      lore:
        - '&7EXP: &f{exp}&7/&f{required}'
        - '&7Điểm kỹ năng: &6{points}'
    close:
      slot: 22
      material: BARRIER
      name: '&cĐóng'

# ---------------- Vé roll tộc ----------------
# Dùng vé (chuột phải hoặc /race roll) → quay ngẫu nhiên một chủng tộc theo độ hiếm.
# Độ hiếm của từng tộc khai báo trong races.yml (rarity). Thứ tự khai báo = thứ hạng (thấp → cao).
roll:
  enabled: true
  title: '&8Roll Chủng Tộc'
  animation-steps: 26           # số bước quay (10-60)
  close-delay-ticks: 60         # tự đóng GUI sau khi ra kết quả
  confirm-when-has-race: true   # đã có tộc: phải dùng vé lần 2 trong confirm-seconds để xác nhận (tránh lỡ tay)
  confirm-seconds: 8
  exclude-current: true         # không roll trúng đúng tộc đang có
  progress-reset: true          # (dùng race.reset-progress-on-change) đổi tộc bằng vé có reset level/nâng cấp
  pity:                         # bảo hiểm: sau N lượt không ra thì lượt kế tiếp chắc chắn ra (0 = tắt)
    epic: 25                    # chắc chắn ra EPIC trở lên
    legendary: 80               # chắc chắn ra LEGENDARY
  rarities:                     # name, color (mã &), weight (tỉ lệ), sound (âm thanh lộ kết quả), broadcast (thông báo toàn server)
                                # pane (màu viền GUI), rgb (màu hạt), fireworks (số đợt pháo hoa), lightning (sét hiệu ứng)
    COMMON:    {name: 'Thường',      color: '&f', weight: 50, sound: entity.experience_orb.pickup, broadcast: false, pane: WHITE_STAINED_GLASS_PANE,  rgb: '#FFFFFF', fireworks: 0, lightning: false}
    RARE:      {name: 'Hiếm',        color: '&9', weight: 30, sound: entity.player.levelup,         broadcast: false, pane: LIGHT_BLUE_STAINED_GLASS_PANE, rgb: '#4DA6FF', fireworks: 1, lightning: false}
    EPIC:      {name: 'Sử thi',      color: '&5', weight: 15, sound: ui.toast.challenge_complete,   broadcast: false, pane: PURPLE_STAINED_GLASS_PANE, rgb: '#B04DFF', fireworks: 3, lightning: false}
    LEGENDARY: {name: 'Huyền thoại', color: '&6', weight: 5,  sound: ui.toast.challenge_complete,   broadcast: true,  pane: ORANGE_STAINED_GLASS_PANE, rgb: '#FFB300', fireworks: 6, lightning: true}
  effects:                      # hiệu ứng lúc quay (vòng ma pháp, hạt hút vào, nhịp tim, nổ theo độ hiếm)
    enabled: true
    density: 1.0                # 0.2 - 3.0, giảm nếu server yếu
    suspense-ticks: 14          # khoảng dừng hồi hộp (nhịp tim) trước khi lộ kết quả

ticket:
  material: PAPER
  name: '&6&lVé Roll Tộc'
  lore:
    - '&7Chuột phải để quay ngẫu nhiên một chủng tộc.'
    - ' '
    - '&8Thường &f50% &8• Hiếm &930% &8• Sử thi &515% &8• Huyền thoại &65%'
    - '&8Bảo hiểm: Sử thi sau 25 lượt, Huyền thoại sau 80 lượt'
    - '&8Kiểm tra bảo hiểm: /race pity'
  glow: true

placeholders:
  no-race: 'Chưa có'
